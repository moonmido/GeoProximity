spring.application.name=es-worker-service

server.port=8091
eureka.client.service-url.defaultZone=http://localhost:8761/eureka

# ===============================
# KAFKA
# ===============================
spring.kafka.bootstrap-servers=localhost:9092
# ---- CONSUMER ----
spring.kafka.consumer.group-id=business-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.GeoProximity.*

# ===============================
# ELASTICSEARCH
# ===============================
spring.elasticsearch.uris=http://localhost:9200
spring.elasticsearch.connection-timeout=5s
spring.elasticsearch.socket-timeout=3s
